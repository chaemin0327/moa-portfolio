name: 작업 등록
description: 기능·수정·문서 작업을 목적별로 등록합니다.
title: "[영역] 타입: 작업 요약"
body:
  - type: dropdown
    id: area
    attributes:
      label: 작업 영역
      options: [BE, FE, COMMON, FE/BE]
    validations:
      required: true
  - type: textarea
    id: purpose
    attributes:
      label: 작업 목적
      description: 필요한 이유를 작성하고 타입·영역 라벨과 담당자를 지정해주세요.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 구현 범위
      value: "- [ ] 구현할 항목"
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 완료 조건
      value: "- [ ] 완료를 판단할 조건"
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: 참고 자료
