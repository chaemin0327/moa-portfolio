<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff"><meta name="description" content="keep it(킵잇). 경험을 저장해, 나만의 포트폴리오로.">
  <title>킵잇 — 나의 경험 아카이브</title>
  <link rel="icon" href="/brand-mark.svg" type="image/svg+xml"><link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">본문으로 이동</a>
  <aside class="sidebar" id="sidebar">
    <a href="#archive" class="brand" aria-label="킵잇 홈"><img class="brand-mark" src="/brand-mark.svg" alt="" width="32" height="32"><strong>keep <span class="brand-accent">it</span></strong></a>
    <nav class="primary-nav" aria-label="주 메뉴">
      <button class="nav-item active" data-page="archive"><i data-icon="archive"></i>나의 경험<span id="nav-count" class="count">0</span></button>
      <button class="nav-item" data-page="timeline"><i data-icon="timeline"></i>타임라인</button>
      <button class="nav-item" data-page="portfolio"><i data-icon="portfolio"></i>포트폴리오<span class="tiny-dot"></span></button>
    </nav>
    <div class="section-label">카테고리</div><nav id="category-nav" class="category-nav" aria-label="경험 종류"></nav>
    <div class="sidebar-bottom">
      <button class="profile-switch" id="profile-button"><span class="avatar" id="profile-initial">나</span><span><strong id="sidebar-name">나의 이름</strong><small>나의 프로필</small></span><i data-icon="settings"></i></button>
    </div>
  </aside>
  <div class="workspace">
    <header class="topbar"><div class="breadcrumb"><button id="menu-button" class="icon-button mobile-menu" aria-label="메뉴 열기"><i data-icon="menu"></i></button><strong id="breadcrumb-page">나의 경험</strong></div></header>
    <main id="main" tabindex="-1">
      <section id="archive-intro" class="archive-intro" aria-label="킵잇 소개"><h1><span>경험을 저장해,</span> <em>나만의 포트폴리오로.</em></h1></section>
      <div id="stats" class="stats" aria-label="경험 통계"></div>
      <section id="archive-page" class="page-section">
        <div class="section-heading"><div><h2>나의 경험 <span id="experience-count">0</span></h2></div><button class="button primary" data-action="add"><i data-icon="plus"></i>경험 추가하기</button></div>
        <div class="collection-toolbar"><div id="filter-chips" class="filter-chips" aria-label="경험 필터"></div><div class="view-switch" aria-label="경험 보기 방식"><button class="selected" data-layout="grid" title="카드로 보기" aria-label="카드로 보기" aria-pressed="true"><i data-icon="grid"></i></button><button data-layout="list" title="목록으로 보기" aria-label="목록으로 보기" aria-pressed="false"><i data-icon="list"></i></button></div></div>
        <div class="search-row"><label class="search-box"><i data-icon="search"></i><input id="search" type="search" aria-label="경험 검색" placeholder="제목, 기관, 태그로 경험 찾기" autocomplete="off"></label><label class="sort-label"><select id="sort" aria-label="경험 정렬"><option value="newest">최근 경험순</option><option value="oldest">오래된 경험순</option><option value="title">제목순</option></select><i data-icon="chevronDown"></i></label></div>
        <div class="demo-note" id="demo-note" hidden><span><i data-icon="info"></i>예시 기록</span><button id="clear-demo">예시 삭제</button></div>
        <div id="experience-list" class="experience-grid" aria-live="polite"><p class="loading">경험을 불러오는 중이에요…</p></div>
      </section>
      <section id="timeline-page" class="page-section" hidden>
        <div class="section-heading"><div><h2>경험의 타임라인</h2></div><button class="button primary" data-action="add"><i data-icon="plus"></i>경험 추가하기</button></div>
        <div class="timeline-tools"><label>경험 종류 <select id="timeline-type"><option value="ALL">모든 경험</option></select></label><div id="timeline-navigation" class="timeline-navigation" role="group" aria-label="타임라인 이동" hidden><button class="icon-button" id="timeline-prev" aria-label="이전 연도 보기" type="button"><i data-icon="arrowRight"></i></button><button class="icon-button" id="timeline-next" aria-label="다음 연도 보기" type="button"><i data-icon="arrowRight"></i></button></div></div><div id="timeline-list" class="timeline-viewport" role="region" aria-label="연도별 경험 타임라인" tabindex="0"></div>
      </section>
      <section id="portfolio-page" class="page-section" hidden>
        <div class="section-heading"><div><h2>나의 포트폴리오</h2></div><button class="button primary" id="print-button"><i data-icon="download"></i>인쇄 / PDF 저장</button></div>
        <div class="portfolio-help"><i data-icon="star"></i><span>별표로 선택한 경험</span><button class="text-link" data-page="archive">경험 선택 →</button></div>
        <article class="portfolio-sheet" id="portfolio-sheet"></article>
      </section>
    </main>
  </div>
  <dialog id="experience-dialog" class="modal form-modal" aria-labelledby="experience-dialog-title">
    <form id="experience-form"><div class="modal-header"><div><h2 id="experience-dialog-title">경험 추가</h2></div><button type="button" class="icon-button" data-close aria-label="닫기"><i data-icon="close"></i></button></div>
      <div class="modal-body"><fieldset class="type-fieldset"><legend>어떤 경험인가요? <span class="required">*</span></legend><div class="type-picker" id="type-picker"></div></fieldset>
        <div class="form-grid"><label class="field full" id="custom-category-field" hidden>분류 이름 *<input name="customCategory" maxlength="30" list="custom-category-options" placeholder="예: 봉사활동, 멘토링, 창업" disabled><datalist id="custom-category-options"></datalist><small>기존 분류를 선택하거나 새로 입력하세요.</small></label><label class="field full">제목 <span class="required">*</span><input name="title" required maxlength="120" placeholder="어떤 경험이었나요?"></label><label class="field"><span id="organization-label">기관 / 소속</span><input name="organization" maxlength="160" placeholder="학교, 회사, 주최 기관 등"></label><label class="field">장소<input name="location" maxlength="160" placeholder="어디서 함께했나요?"></label><label class="field"><span id="start-label">시작일 *</span><input name="startDate" type="date" required></label><label class="field"><span id="end-label">종료일</span><input name="endDate" type="date"></label><label class="check-field full" id="ongoing-field"><input type="checkbox" name="ongoing"><span id="ongoing-label">아직 진행 중인 경험이에요</span></label><label class="field" data-field="participants">함께한 사람<input name="participants" maxlength="300" placeholder="팀명이나 함께한 사람을 남겨보세요"></label><label class="field" data-field="role"><span id="role-label">나의 역할</span><input name="role" maxlength="200" placeholder="내가 맡았던 일을 적어주세요"></label><label class="field full">경험 내용<textarea name="description" rows="5" maxlength="10000" placeholder="무엇을 했고, 어떤 점을 배웠나요?&#10;내가 한 일과 느낀 점을 편하게 남겨보세요."></textarea></label><fieldset id="competition-results" class="result-fieldset full" hidden><legend>최종 결과</legend><div class="form-grid"><label class="field">최종 순위 / 진출 단계<input name="placement" maxlength="40" placeholder="예: 3위, 본선 진출, 상위 10%" disabled></label><label class="field">상 이름<input name="awardName" maxlength="100" placeholder="예: 대상, 최우수상, 우수상" disabled></label></div><small>결과가 없으면 비워두세요.</small></fieldset><label class="field full"><span id="outcome-label">결과 / 성과</span><input name="outcome" maxlength="1000" placeholder="수상 여부, 완성한 결과물, 배운 점 등"></label><label class="field full"><span id="tags-label">태그 / 사용 기술</span><input name="tags" maxlength="300" placeholder="Java, 협업, 기획처럼 쉼표로 구분해주세요"></label><fieldset class="links-fieldset full"><legend>관련 링크</legend><div id="experience-links"></div><button class="button secondary" id="add-link" type="button">＋ 링크 추가</button><small>최대 10개</small></fieldset><label class="check-field full featured-check"><input type="checkbox" name="featured" checked><span><strong>포트폴리오에 담기</strong><small>포트폴리오에 표시</small></span><i data-icon="star"></i></label></div><p class="form-error" id="form-error" role="alert"></p>
      </div><div class="modal-footer"><span><span class="required">*</span> 필수 항목</span><div><button type="button" class="button secondary" data-close>취소</button><button type="submit" class="button primary" id="save-experience">저장 <i data-icon="arrowRight"></i></button></div></div>
    </form>
  </dialog>
  <dialog id="detail-dialog" class="modal detail-modal" aria-labelledby="detail-title"><div id="detail-content"></div></dialog>
  <dialog id="profile-dialog" class="modal profile-modal" aria-labelledby="profile-title"><form id="profile-form"><div class="modal-header"><div><h2 id="profile-title">프로필 수정</h2></div><button class="icon-button" type="button" data-close aria-label="닫기"><i data-icon="close"></i></button></div><div class="modal-body form-grid"><label class="field full">이름 *<input name="name" maxlength="50" required></label><label class="field full">한 줄 소개<input name="headline" maxlength="160" placeholder="어떤 사람으로 기억되고 싶나요?"></label><label class="field full">자기소개<textarea name="bio" rows="4" maxlength="2000"></textarea></label><label class="field full">이메일<input name="email" type="email" maxlength="160" placeholder="hello@example.com"></label><p class="form-error full" role="alert"></p></div><div class="modal-footer"><span>포트폴리오에 표시됩니다.</span><button class="button primary" type="submit">프로필 저장</button></div></form></dialog>
  <dialog id="confirm-dialog" class="modal confirm-modal" aria-labelledby="confirm-title"><div class="modal-header"><h2 id="confirm-title">기록을 삭제할까요?</h2><button class="icon-button" data-close aria-label="닫기"><i data-icon="close"></i></button></div><div class="modal-body"><p id="confirm-message"></p><p class="form-error" role="alert"></p></div><div class="modal-footer"><button class="button secondary" data-close>취소</button><button class="button danger" id="confirm-yes">삭제하기</button></div></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
